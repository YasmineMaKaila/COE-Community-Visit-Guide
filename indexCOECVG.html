<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A mobile-first Community Visit Guide for new associates in Cortland's Centers of Excellence.">
<meta name="theme-color" content="#033D7E">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><path d=%22M20 5 L35 33 L5 33 Z%22 fill=%22%23F1BC02%22 stroke=%22%23F1BC02%22 stroke-width=%224%22 stroke-linejoin=%22round%22/></svg>">
<title>Community Visit Guide | Cortland Centers of Excellence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Slab:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#033D7E; --gold:#F1BC02; --lime:#A9C23F; --teal:#0092BD; --magenta:#C6027E; --peach:#FFE7D4; --sky:#A8E6FA;
  --bg:#F4F7FB; --surface:#FFFFFF; --surface-2:#EEF3F9; --text:#15345C; --head:#033D7E; --muted:#4B5F7A; --line:#D8E1EC;
  --focus:#C6027E; --shadow:0 1px 0 rgba(3,61,126,.06), 0 8px 24px -12px rgba(3,61,126,.28);
  --lens:#033D7E; --lens-strong:#033D7E; --ribbon:#F1BC02; --tint:#FFE7D4; --tint-ink:#033D7E; --lens-ink:#FFFFFF;
  --onsite-tint:#FFF3C4;
  --sans:'Outfit','TT Norms','Gotham','Segoe UI',system-ui,-apple-system,sans-serif;
  --slab:'Josefin Slab','Rockwell','Georgia',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);height:100%}
:root[data-coe="sas"]{--lens-strong:#A9C23F;--lens:#A9C23F;--ribbon:#C6027E;--tint:#EEF6D2;--lens-ink:#033D7E}
:root[data-coe="rs"]{--lens-strong:#006F90;--lens:#0092BD;--ribbon:#A4CE4F;--tint:#D8F2FB;--lens-ink:#FFFFFF}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#031C38; --surface:#082A52; --surface-2:#0C3563; --text:#E8F0FA; --head:#FFFFFF; --muted:#AFC2DA; --line:#1C4777;
    --shadow:0 10px 26px -14px rgba(0,0,0,.7); --tint-ink:#FFFFFF; --onsite-tint:#3A3210; --focus:#F1BC02; color-scheme:dark;
    --tint:#1D3A60;
  }
  :root:not([data-theme="light"])[data-coe="sas"]{--tint:#26391A}
  :root:not([data-theme="light"])[data-coe="rs"]{--tint:#0B3D55}
}
:root[data-theme="dark"]{
  --bg:#031C38; --surface:#082A52; --surface-2:#0C3563; --text:#E8F0FA; --head:#FFFFFF; --muted:#AFC2DA; --line:#1C4777;
  --shadow:0 10px 26px -14px rgba(0,0,0,.7); --tint-ink:#FFFFFF; --onsite-tint:#3A3210; --focus:#F1BC02; color-scheme:dark; --tint:#1D3A60;
}
:root[data-theme="dark"][data-coe="sas"]{--tint:#26391A}
:root[data-theme="dark"][data-coe="rs"]{--tint:#0B3D55}

*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:10px}
[data-focus]:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;background:var(--gold);color:var(--navy);padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;text-decoration:none}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 10px)}

/* ---------- type ---------- */
h1,h2,h3{font-family:var(--sans);color:var(--head);margin:0}
.h1{font-weight:800;font-size:clamp(1.85rem,7.4vw,2.6rem);line-height:1.05;letter-spacing:.06em;text-transform:uppercase}
.h2{font-weight:800;font-size:clamp(1.3rem,5.2vw,1.65rem);line-height:1.1;letter-spacing:.06em;text-transform:uppercase}
.h3{font-weight:700;font-size:1.1rem;line-height:1.25}
.lede{font-size:1.06rem;color:var(--muted);max-width:36em;margin:.75rem 0 0}
.slab{font-family:var(--slab);font-weight:600;letter-spacing:.005em}
p{margin:.6rem 0 0}

/* ---------- layout ---------- */
.wrap{width:100%;max-width:680px;margin:0 auto;padding:0 20px}
.wrap.wide{max-width:1120px}
main{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
main.no-bar{padding-bottom:40px}
main.flush{padding-bottom:0}
.view-head{padding:28px 0 8px}
.chapter-no{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--muted);font-size:.95rem;margin-bottom:12px}
.chapter-no .mini{width:22px;height:22px}
section.block{margin-top:34px}
.stack>*+*{margin-top:12px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.topbar .row{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:block;height:22px;width:auto;flex:0 0 auto}
.brand.on-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand.on-light{display:none}:root:not([data-theme="light"]) .brand.on-dark{display:block}}
:root[data-theme="dark"] .brand.on-light{display:none}:root[data-theme="dark"] .brand.on-dark{display:block}
.progress{display:flex;gap:6px;margin-left:auto;align-items:center}
.pstep{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:12px;cursor:pointer;padding:0;position:relative}
.pstep .pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);transition:transform .2s}
.pstep[data-visited="true"] .pip{background:var(--lens);border-color:var(--lens)}
.pstep[aria-current="step"] .pip{transform:scale(1.35);border-color:var(--ribbon);background:var(--ribbon)}
.lens-chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px 6px 8px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap}
.lens-chip svg{width:20px;height:20px}
@media (max-width:420px){.pstep{width:34px}.lens-chip .lens-word{display:none}.lens-chip{padding:6px 10px}}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottombar .row{display:flex;gap:12px;align-items:center;padding-top:12px;padding-bottom:12px}
.bottombar .btn-primary{flex:1}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;border-radius:16px;border:0;font-weight:700;font-size:1.02rem;cursor:pointer;text-decoration:none;transition:transform .15s ease, box-shadow .15s ease, background .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--gold);color:#033D7E;box-shadow:0 6px 0 -1px #C99A00}
.btn-primary:active{box-shadow:0 2px 0 -1px #C99A00;transform:translateY(3px)}
.btn-ghost{background:transparent;border:2px solid var(--line);color:var(--head)}
.btn-lens{background:var(--lens-strong);color:var(--lens-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn svg{width:20px;height:20px;flex:0 0 auto}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}
.btn-row .btn{flex:1 1 220px}

/* ---------- welcome ---------- */
.welcome{min-height:100vh;min-height:100svh;background:#033D7E;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.welcome .wrap{position:relative;z-index:2;display:flex;flex-direction:column;flex:1;padding-top:28px;padding-bottom:36px}
.welcome .logo{height:26px;width:auto;align-self:flex-start}
.welcome h1{color:#fff;margin-top:auto;padding-top:210px;font-size:clamp(2.2rem,10vw,3.4rem);font-weight:800;letter-spacing:.07em;text-transform:uppercase;line-height:1.02}
.welcome .intro{font-size:1.1rem;max-width:30em;color:#DCE8F7;margin-top:18px}
.welcome .intro strong{color:#fff;font-weight:600}
.cue-list{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-wrap:wrap;gap:10px 22px;max-width:30em}
.cue-list li{display:flex;align-items:center;gap:10px;font-family:var(--slab);font-weight:700;font-size:1.22rem;color:#fff}
.cue-list svg{width:18px;height:18px;flex:0 0 auto}
.welcome .closer{font-size:1.02rem;color:#DCE8F7;margin-top:22px;max-width:30em}
.welcome .cta{margin-top:26px;display:flex;flex-direction:column;gap:12px;max-width:420px}
.welcome .cta .btn-ghost{border-color:rgba(255,255,255,.35);color:#fff}
.welcome .note{font-size:.88rem;color:#B9CDE6;margin-top:16px;display:flex;gap:8px;align-items:flex-start}
.welcome .note svg{width:18px;height:18px;flex:0 0 auto;margin-top:2px}
.cluster{position:absolute;top:64px;right:-30px;width:300px;height:230px;z-index:1;pointer-events:none;transform:scale(.82);transform-origin:top right}
.cluster svg{position:absolute;overflow:visible}
@media (min-width:760px){.cluster{right:4%;top:70px;transform:scale(1.15)}.welcome h1{padding-top:140px;max-width:9em}}

/* ---------- shapes ---------- */
.shape{display:inline-block;vertical-align:middle}

/* ---------- COE tiles ---------- */
.coe-list{display:grid;gap:14px;margin-top:24px}
.coe-tile{display:grid;grid-template-columns:64px 1fr 28px;gap:16px;align-items:center;text-align:left;width:100%;padding:18px;border-radius:22px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;min-height:96px;transition:border-color .2s, transform .15s}
.coe-tile:active{transform:scale(.99)}
.coe-tile .emblem{width:64px;height:64px;border-radius:18px;display:grid;place-items:center}
.coe-tile .emblem svg{width:38px;height:38px}
.coe-tile .name{font-weight:700;font-size:1.12rem;color:var(--head);line-height:1.2}
.coe-tile .desc{font-size:.93rem;color:var(--muted);margin-top:4px;line-height:1.4}
.coe-tile .tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.coe-tile .tick svg{width:16px;height:16px;opacity:0}
.coe-tile[aria-checked="true"]{border-color:var(--navy)}
.coe-tile[aria-checked="true"] .tick{background:var(--gold);border-color:var(--gold)}
.coe-tile[aria-checked="true"] .tick svg{opacity:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .coe-tile[aria-checked="true"]{border-color:var(--gold)}}
:root[data-theme="dark"] .coe-tile[aria-checked="true"]{border-color:var(--gold)}
.lens-confirm{margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--tint);color:var(--tint-ink);font-weight:600;display:flex;gap:10px;align-items:center}
.lens-confirm svg{width:22px;height:22px;flex:0 0 auto}

/* ---------- trail map ---------- */
.flex-note{margin-top:18px;padding:16px 18px;border-radius:18px;background:var(--tint);color:var(--tint-ink);display:flex;gap:12px;align-items:flex-start}
.flex-note svg{width:26px;height:26px;flex:0 0 auto;margin-top:1px}
.flex-note p{margin:0}
.trail{position:relative;margin-top:22px}
.trail svg.ribbon{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:0}
.trail ol{list-style:none;margin:0;padding:0;position:relative;z-index:1}
.stop{position:relative}
.stop-btn{display:grid;grid-template-columns:var(--off,24px) 44px 1fr 24px;align-items:center;width:100%;min-height:68px;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;border-radius:16px}
.stop:nth-child(even) .stop-btn{--off:72px}
.stop-dot{grid-column:2;width:40px;height:40px;border-radius:50%;background:var(--surface);border:3px solid var(--navy);display:grid;place-items:center;font-weight:800;font-size:.95rem;color:var(--head);box-shadow:var(--shadow)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stop-dot{border-color:var(--sky)}}
:root[data-theme="dark"] .stop-dot{border-color:var(--sky)}
.stop-title{grid-column:3;padding-left:14px;font-weight:700;font-size:1.06rem;color:var(--head);line-height:1.2}
.stop-chev{grid-column:4;width:22px;height:22px;transition:transform .2s;color:var(--muted)}
.stop-btn[aria-expanded="true"] .stop-chev{transform:rotate(180deg)}
.stop-btn[aria-expanded="true"] .stop-dot{background:var(--ribbon);border-color:var(--ribbon);color:#033D7E}
.stop-panel{margin:0 0 8px calc(var(--off,24px) + 58px);padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.stop:nth-child(even) .stop-panel{--off:72px}
.stop-panel p{margin:0;color:var(--muted)}
.stop-panel .btn{margin-top:10px;min-height:48px;font-size:.95rem;padding:0 16px}
@media (max-width:380px){.stop:nth-child(even) .stop-btn,.stop:nth-child(even) .stop-panel{--off:48px}}

.tips{display:grid;gap:12px;margin-top:16px}
.tip{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.tip .ic{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;color:var(--head)}
.tip .ic svg{width:24px;height:24px}
.tip p{margin:4px 0 0;color:var(--muted);font-size:.97rem}

/* ---------- explore ---------- */
.areas{display:grid;gap:12px;margin-top:20px}
@media (min-width:720px){.areas{grid-template-columns:1fr 1fr}.areas .area[data-open="true"]{grid-column:1/-1}}
.area{border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.area-btn{display:grid;grid-template-columns:52px 1fr 24px;gap:14px;align-items:center;width:100%;min-height:84px;padding:16px;border:0;background:none;text-align:left;cursor:pointer}
.area-btn .ic{width:52px;height:52px;border-radius:16px;background:var(--tint);color:var(--tint-ink);display:grid;place-items:center;position:relative}
.area-btn .ic svg{width:26px;height:26px}
.area-btn .ic .flag{position:absolute;right:-6px;top:-6px;width:22px;height:22px}
.area-name{font-weight:700;font-size:1.08rem;color:var(--head);line-height:1.2}
.with-team{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:.84rem;font-weight:600;color:var(--head);background:var(--onsite-tint);padding:3px 10px 3px 8px;border-radius:999px}
.with-team svg{width:16px;height:16px}
.area-btn .chev{width:22px;height:22px;color:var(--muted);transition:transform .2s}
.area-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.area-body{padding:0 18px 18px}
.notice{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.notice li{font-family:var(--slab);font-weight:600;font-size:1.18rem;line-height:1.3;color:var(--head);padding-left:26px;position:relative}
.notice li::before{content:"";position:absolute;left:2px;top:.42em;width:12px;height:12px;background:var(--ribbon);clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:2px}
:root[data-coe="sas"] .notice li::before{clip-path:none;border-radius:50%}
:root[data-coe="rs"] .notice li::before{clip-path:none;border-radius:50%;background:none;border:3px solid var(--ribbon)}
.snap{margin-top:14px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:.95rem}
.snap svg{width:22px;height:22px;flex:0 0 auto;color:var(--magenta)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .snap svg{color:var(--gold)}}
:root[data-theme="dark"] .snap svg{color:var(--gold)}
.snap b{font-weight:700;color:var(--head)}
.explored{margin-top:14px;min-height:48px;display:inline-flex;align-items:center;gap:10px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:none;cursor:pointer;font-weight:600;color:var(--head)}
.explored svg{width:20px;height:20px}
.explored[aria-pressed="true"]{background:var(--tint);border-color:var(--lens);color:var(--tint-ink)}

.culture{margin-top:40px;padding:26px 20px;border-radius:28px;background:var(--surface);border:1px solid var(--line)}
.credo{font-family:var(--slab);font-size:1.22rem;font-weight:600;line-height:1.4;color:var(--head);margin:14px 0 0;padding-left:16px;border-left:4px solid var(--ribbon)}
.credo-src{font-size:.85rem;color:var(--muted);margin-top:8px}
.culture-prompts{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:10px}
.culture-prompts li{padding:14px 16px;border-radius:16px;background:var(--surface-2);font-weight:500}
.values{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.value-chip{min-height:48px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-align:left;display:inline-flex;align-items:center;gap:8px;color:var(--head)}
.value-chip svg{width:18px;height:18px;opacity:.35}
.value-chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#033D7E}
.value-chip[aria-pressed="true"] svg{opacity:1}
label.field{display:block;font-weight:600;margin-top:22px;color:var(--head)}
textarea{width:100%;margin-top:8px;min-height:104px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:1.02rem;line-height:1.45;resize:vertical}
textarea:focus{outline:none;border-color:var(--lens);box-shadow:0 0 0 3px color-mix(in srgb,var(--lens) 30%,transparent)}
.hint{font-size:.88rem;color:var(--muted);margin-top:6px}

/* ---------- question decks ---------- */
.deck{display:grid;gap:12px;margin-top:20px}
.q{display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:start;padding:20px 12px 20px 20px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.q.is-new{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.q p{margin:0;font-family:var(--slab);font-weight:600;font-size:1.26rem;line-height:1.3;color:var(--head)}
.q .star{width:48px;height:48px;border-radius:14px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.q .star svg{width:24px;height:24px}
.q .star[aria-pressed="true"]{color:#C99A00}
.q .star[aria-pressed="true"] svg{fill:var(--gold)}
.deck.lens .q{background:var(--tint);border-color:transparent}
.deck.lens .q p{color:var(--tint-ink)}
.deck-foot{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.deck-foot .count{color:var(--muted);font-size:.92rem}
.lens-head{display:flex;align-items:center;gap:14px}
.lens-head svg{width:40px;height:40px;flex:0 0 auto}
.saved{margin-top:40px;padding:22px 20px;border-radius:24px;border:2px dashed var(--line)}
.saved ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.saved li{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:.98rem}
.saved li svg{width:18px;height:18px;margin-top:3px;fill:var(--gold);color:#C99A00}

/* ---------- resident journey ---------- */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tag{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:4px 12px 4px 8px;border-radius:999px;font-size:.86rem;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--head)}
.tag svg{width:16px;height:16px;flex:0 0 auto}
.tag.mine{background:var(--lens-strong);border-color:var(--lens-strong);color:var(--lens-ink)}
.tag.onsite{background:var(--onsite-tint);border-color:transparent}
.journey{margin-top:24px;position:relative}
.journey ol{list-style:none;margin:0;padding:0;position:relative}
.journey ol::before{content:"";position:absolute;left:27px;top:28px;bottom:28px;width:4px;border-radius:4px;background:repeating-linear-gradient(to bottom,var(--sky) 0 10px,transparent 10px 18px)}
.stage{position:relative}
.stage-btn{display:grid;grid-template-columns:58px 1fr 24px;align-items:center;gap:12px;width:100%;min-height:76px;padding:8px 0;border:0;background:none;text-align:left;cursor:pointer;border-radius:18px}
.stage-mark{width:58px;height:58px;display:grid;place-items:center;position:relative}
.stage-mark .disc{width:46px;height:46px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--head);font-size:1rem}
.stage.mine .stage-mark .disc{border-color:var(--lens);background:var(--tint);color:var(--tint-ink)}
.stage-mark .badge{position:absolute;right:-2px;top:0;width:22px;height:22px}
.stage-name{font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:1.02rem;color:var(--head);line-height:1.15}
.stage-sum{display:block;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:.95rem;margin-top:3px}
.stage-btn .chev{width:22px;height:22px;color:var(--muted);transition:transform .2s}
.stage-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.stage-btn[aria-expanded="true"] .disc{background:var(--ribbon);border-color:var(--ribbon);color:#033D7E}
.stage-detail{margin:0 0 12px 70px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.who{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.who li{display:grid;gap:6px;justify-items:start}
.who .role{font-size:.95rem;color:var(--muted);line-height:1.4}
.journey-desk{display:none}
@media (min-width:960px){
  .journey.mobile{display:none}
  .journey-desk{display:block;margin-top:28px}
  .jrow{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;position:relative;padding-top:6px}
  .jrow::before{content:"";position:absolute;left:5%;right:5%;top:35px;height:4px;border-radius:4px;background:repeating-linear-gradient(to right,var(--sky) 0 10px,transparent 10px 18px)}
  .jrow .stage-btn{grid-template-columns:1fr;justify-items:center;text-align:center;gap:8px;padding:0 4px 10px;min-height:0}
  .jrow .stage-btn .chev{display:none}
  .jrow .stage-name{font-size:.84rem}
  .jrow .stage-sum{font-size:.82rem}
  .jrow .stage-btn[aria-pressed="true"] .disc{background:var(--ribbon);border-color:var(--ribbon);color:#033D7E;transform:scale(1.08)}
  .jpanel{margin-top:16px;padding:22px 24px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;grid-template-columns:260px 1fr;gap:24px}
  .jpanel h3{font-size:1.4rem;letter-spacing:.05em;text-transform:uppercase;font-weight:800}
}
.supports{margin-top:30px;padding:28px 22px 96px;border-radius:28px;background:#033D7E;color:#fff;position:relative;overflow:hidden}
.supports h2{color:#fff}
.supports p{color:#DCE8F7}
.supports .promise{font-family:var(--slab);font-size:1.35rem;font-weight:700;color:#fff;margin-top:14px}
.supports .deco{position:absolute;right:10px;bottom:-14px;width:110px;height:110px}
@media (min-width:720px){.supports{padding-right:150px;padding-bottom:28px}}

/* ---------- reflect ---------- */
.reflect-card{margin-top:24px;padding:24px 20px;border-radius:28px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.reflect-steps{display:flex;gap:8px;margin-bottom:18px}
.reflect-steps span{height:6px;flex:1;border-radius:6px;background:var(--line)}
.reflect-steps span.on{background:var(--lens)}
.reflect-card label{display:block;font-family:var(--slab);font-weight:700;font-size:1.5rem;line-height:1.2;color:var(--head)}
.reflect-card textarea{min-height:150px}
.counter{font-size:.85rem;color:var(--muted);text-align:right;margin-top:6px}

/* ---------- complete ---------- */
.done-hero{position:relative;background:#033D7E;color:#fff;overflow:hidden;padding:44px 0 36px}
.done-hero h1{color:#fff;font-size:clamp(1.9rem,8.4vw,3rem);font-weight:800;letter-spacing:.06em;line-height:1.05;text-transform:uppercase;max-width:12em}
.done-hero p{color:#DCE8F7;max-width:30em;font-size:1.08rem}
.done-check{width:84px;height:84px;border-radius:50%;background:var(--gold);display:grid;place-items:center;margin-bottom:20px;box-shadow:0 0 0 10px rgba(241,188,2,.22)}
.done-check svg{width:44px;height:44px;color:#033D7E}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:0}
.confetti span{position:absolute;top:-30px;animation:fall 2.6s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}75%{opacity:1}100%{transform:translateY(var(--dy,380px)) rotate(var(--rot,220deg));opacity:0}}
.done-hero .wrap{position:relative;z-index:1}
.recap{display:grid;gap:12px;margin-top:24px}
.recap-item{padding:18px 20px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.recap-item h3{font-family:var(--slab);font-weight:700;font-size:1.15rem}
.recap-item p{white-space:pre-wrap;word-break:break-word}
.recap-item p.empty{color:var(--muted);font-style:italic}
.status{min-height:1.5em;margin-top:12px;font-weight:600;color:var(--head)}
.copy-fallback textarea{min-height:180px;font-size:.92rem}
.fine{font-size:.88rem;color:var(--muted);margin-top:14px}

@media (min-width:720px){
  .view-head{padding-top:44px}
  .culture{padding:32px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .confetti{display:none}
}
</style>
</head>

        '<h2 class="h2">This is the experience our work supports.</h2>'+
        '<p>Across the journey, the Centers of Excellence and onsite teams each play a part. Today you get to see it up close.</p>'+
        '<p class="promise">Cortland\u2019s brand promise: a life of everyday delight.</p>'+
        '<svg class="deco" viewBox="0 0 120 120" aria-hidden="true"><path d="M38 30 L64 78 L12 78 Z" fill="#F1BC02" stroke="#F1BC02" stroke-width="6" stroke-linejoin="round"/><circle cx="82" cy="52" r="22" fill="#A9C23F"/><circle cx="74" cy="94" r="16" fill="none" stroke="#A8E6FA" stroke-width="7"/></svg>'+
      '</div></div>';
  },

  reflect: function(){
    var i = S.rstep;
    var bars = [0,1,2].map(function(j){return '<span class="'+(j<=i?'on':'')+'"></span>';}).join('');
    return '<div class="wrap">'+chapterHead('reflect','My community takeaways','Three quick thoughts to carry back with you. Short is perfect.')+
      '<div class="reflect-card">'+
        '<div class="reflect-steps" aria-hidden="true">'+bars+'</div>'+
        '<p class="hint" style="margin:0 0 10px">Prompt '+(i+1)+' of 3</p>'+
        '<label for="take'+i+'">'+esc(takePrompt(i))+'</label>'+
        '<textarea id="take'+i+'" data-take="'+i+'" maxlength="400" aria-describedby="count'+i+'">'+esc(S.take[i])+'</textarea>'+
        '<p class="counter" id="count'+i+'">'+S.take[i].length+' / 400</p>'+
        (i>0 ? '<button class="btn btn-ghost" data-act="rprev" style="margin-top:6px">Previous prompt</button>' : '')+
      '</div></div>';
  },

  complete: function(){
    var items = [0,1,2].map(function(i){
      var t = S.take[i].trim();
      return '<div class="recap-item"><h3>'+esc(takePrompt(i))+'</h3><p class="'+(t?'':'empty')+'">'+(t?esc(t):'Left blank. You can add it anytime.')+'</p></div>';
    }).join('');
    return '<div class="done-hero"><div class="confetti" id="confetti" aria-hidden="true"></div><div class="wrap">'+
        '<div class="done-check">'+icon('check')+'</div>'+
        '<h1 tabindex="-1" data-focus>Community visit complete \u2713</h1>'+
        '<p>Thanks for exploring with curiosity. You saw the resident experience up close, and now you know the people behind it.</p>'+
      '</div></div>'+
      '<div class="wrap">'+
        '<section class="block"><h2 class="h2">What you\u2019re taking with you</h2><div class="recap">'+items+'</div></section>'+
        '<section class="block"><div class="btn-row">'+
          '<button class="btn btn-primary" data-act="copy">'+icon('copy')+'Copy my takeaways</button>'+
          '<button class="btn btn-lens" data-act="pdf" id="pdfBtn">'+icon('pdf')+'Save as PDF</button>'+
        '</div>'+
        '<p class="status" id="status" role="status"></p>'+
        '<div class="copy-fallback" id="copyFallback" hidden><label class="field" for="copyText">Select all of this text and copy it into your notes.</label><textarea id="copyText" readonly></textarea></div>'+
        '<div class="btn-row" style="margin-top:20px">'+
          '<button class="btn btn-ghost" data-act="goto" data-view="reflect">Edit my takeaways</button>'+
          '<button class="btn btn-ghost" data-act="goto" data-view="ready">Revisit my guide</button>'+
        '</div>'+
        '<button class="btn btn-ghost" data-act="reset" id="resetBtn" style="margin-top:12px;width:100%">Start a fresh visit</button>'+
        '<p class="fine">Your notes stay on this device only. Starting a fresh visit clears them.</p>'+
      '</section></div>';
  }
};

function stageMark(i, mine){
  return '<span class="stage-mark"><span class="disc">'+(i+1)+'</span>'+(mine ? shape(S.coe, S.coe==='lh' ? '#F1BC02' : null, 'badge') : '')+'</span>';
}
function whoHTML(st){
  return '<ul class="who">'+st.who.map(function(w){
    return '<li>'+tagHTML(w)+(w.role?'<span class="role">'+esc(w.role)+'</span>':'')+'</li>';
  }).join('')+'</ul>';
}
function deckHTML(which, list, idx, isLens){
  var n = list.length, cards = '';
  for (var j=0;j<3;j++){
    var qi = (idx + j) % n;
    var key = (isLens ? 'l:'+S.coe+':' : 'm:') + qi;
    var on = S.stars.indexOf(key) > -1;
    cards += '<div class="q'+(j===2 && lastRotated===which ? ' is-new':'')+'"><p>'+esc(list[qi])+'</p>'+
      '<button class="star" aria-pressed="'+on+'" aria-label="'+(on?'Saved: ':'Save question: ')+esc(list[qi])+'" data-act="star" data-key="'+key+'">'+icon('star')+'</button></div>';
  }
  var shown = Math.min(idx + 3, n);
  return '<div class="deck'+(isLens?' lens':'')+'" id="deck-'+which+'">'+cards+'</div>'+
    '<div class="deck-foot"><button class="btn btn-primary" data-act="rotate" data-deck="'+which+'">'+icon('shuffle')+'Give me another question</button>'+
    '<span class="count">'+n+' questions in this deck</span></div>';
}
function questionFor(key){
  var p = key.split(':');
  if (p[0]==='m') return SHARED_Q[+p[1]];
  return (LENS_Q[p[1]]||[])[+p[2]];
}
function savedHTML(){
  if (!S.stars.length) return '<div class="saved"><h2 class="h3">Questions I saved</h2><p class="hint">Tap the star on any question to keep it here for later.</p></div>';
  return '<div class="saved"><h2 class="h3">Questions I saved</h2><ul>'+S.stars.map(function(k){var q=questionFor(k); return q?'<li>'+icon('star')+'<span>'+esc(q)+'</span></li>':'';}).join('')+'</ul></div>';
}

/* =========================================================
   RENDER
   ========================================================= */
var lastRotated = null, ribbonDrawn = false;
var ORDER = ['welcome','coe','ready','explore','connect','journey','reflect','complete'];

function render(opts){
  opts = opts || {};
  var v = S.view;
  if (!S.coe && ORDER.indexOf(v) > 1) v = S.view = 'coe';
  if (S.coe) document.documentElement.setAttribute('data-coe', S.coe); else document.documentElement.removeAttribute('data-coe');
  main.innerHTML = VIEWS[v]();
  lastRotated = null;
  var full = v === 'welcome' || v === 'complete';
  topbar.hidden = v === 'welcome';
  bottombar.hidden = v === 'welcome' || v === 'complete';
  main.classList.toggle('no-bar', bottombar.hidden);
  main.classList.toggle('flush', v === 'welcome');
  renderChrome(v);
  if (v === 'ready') { requestAnimationFrame(function(){ drawRibbon(!ribbonDrawn); ribbonDrawn = true; }); }
  if (v === 'complete') confetti();
  if (opts.focus !== false) {
    if (opts.anchor) {
      var a = document.getElementById(opts.anchor);
      if (a) { a.scrollIntoView({block:'start'}); a.focus({preventScroll:true}); return; }
    }
    window.scrollTo(0,0);
    var f = main.querySelector('[data-focus]'); if (f) f.focus({preventScroll:true});
  }
}

function renderChrome(v){
  var prog = document.getElementById('progress');
  var inChap = CHAPTERS.findIndex(function(c){return c.id===v;});
  prog.innerHTML = S.coe ? CHAPTERS.map(function(c,i){
    var visited = S.visited.indexOf(c.id) > -1;
    return '<button class="pstep" data-act="goto" data-view="'+c.id+'" data-visited="'+visited+'"'+(i===inChap?' aria-current="step"':'')+' aria-label="Stop '+(i+1)+': '+esc(c.name)+(visited?' (visited)':'')+'"><span class="pip"></span></button>';
  }).join('') : '';
  var chip = document.getElementById('lensChip');
  if (S.coe) {
    chip.hidden = false;
    chip.innerHTML = shape(S.coe)+'<span><span class="lens-word">Lens: </span>'+esc(COES[S.coe].chip)+'</span>';
    chip.setAttribute('aria-label','Your lens: '+COES[S.coe].name+'. Change COE');
  } else chip.hidden = true;
  var back = document.getElementById('backBtn'), next = document.getElementById('nextBtn');
  back.hidden = false;
  if (v === 'coe') { next.textContent = 'Start exploring'; next.disabled = !S.coe; }
  else if (v === 'reflect') { next.textContent = S.rstep < 2 ? 'Next prompt' : 'Finish my visit'; next.disabled = false; }
  else if (v === 'journey') { next.textContent = 'Next stop: Reflect'; next.disabled = false; }
  else { var ni = inChap + 1; next.textContent = ni < CHAPTERS.length ? 'Next stop: ' + (CHAPTERS[ni].short || CHAPTERS[ni].name) : 'Next'; next.disabled = false; }
}

function markVisited(v){ if (CHAPTERS.some(function(c){return c.id===v;}) && S.visited.indexOf(v) < 0) S.visited.push(v); }
function go(v, anchor){
  var from = S.view;
  if (from && from !== v) markVisited(from);
  S.view = v; markVisited(v); save(); render({anchor:anchor});
}

/* =========================================================
   TRAIL RIBBON (decorative, recomputed on resize)
   ========================================================= */
function drawRibbon(animate){
  var trail = document.getElementById('trail'), svg = document.getElementById('ribbon');
  if (!trail || !svg) return;
  var r = trail.getBoundingClientRect();
  var pts = Array.prototype.map.call(trail.querySelectorAll('.stop-dot'), function(d){
    var b = d.getBoundingClientRect(); return [b.left + b.width/2 - r.left, b.top + b.height/2 - r.top];
  });
  if (pts.length < 2) return;
  var d = 'M' + pts[0][0] + ' ' + (pts[0][1]-28) + ' L' + pts[0][0] + ' ' + pts[0][1];
  for (var i=0;i<pts.length-1;i++){
    var a = pts[i], b = pts[i+1], dy = b[1]-a[1];
    if (i === 3 || i === 6) {
      var mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2, lr = 15, dir = b[0] > a[0] ? 1 : -1;
      d += ' C'+a[0]+' '+(a[1]+dy*.45)+' '+(mx-dir*lr)+' '+(my)+' '+mx+' '+(my+lr);
      d += ' a'+lr+' '+lr+' 0 1 '+(dir>0?0:1)+' 0 '+(-2*lr)+' a'+lr+' '+lr+' 0 1 '+(dir>0?0:1)+' 0 '+(2*lr);
      d += ' C'+(mx+dir*lr)+' '+(my+lr)+' '+b[0]+' '+(b[1]-dy*.45)+' '+b[0]+' '+b[1];
    } else {
      d += ' C'+a[0]+' '+(a[1]+dy*.55)+' '+b[0]+' '+(b[1]-dy*.55)+' '+b[0]+' '+b[1];
    }
  }
  svg.setAttribute('width', r.width); svg.setAttribute('height', r.height);
  svg.setAttribute('viewBox','0 0 '+r.width+' '+r.height);
  svg.innerHTML = '<path d="'+d+'" style="fill:none;stroke:var(--ribbon)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>'+
                  '<path d="'+d+'" style="fill:none;stroke:var(--surface)" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round" opacity=".9"/>';
  if (animate && !reduced()) {
    var p = svg.querySelector('path'), len = p.getTotalLength();
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    p.getBoundingClientRect();
    p.style.transition = 'stroke-dashoffset 1.6s cubic-bezier(.4,.1,.2,1)';
    p.style.strokeDashoffset = '0';
    setTimeout(function(){ p.style.strokeDasharray=''; p.style.transition=''; }, 1700);
  }
}
var rT; window.addEventListener('resize', function(){ clearTimeout(rT); rT = setTimeout(function(){ if (S.view==='ready') drawRibbon(false); }, 120); });

/* =========================================================
   CONFETTI (one celebratory moment; static when reduced motion)
   ========================================================= */
function confetti(){
  var box = document.getElementById('confetti'); if (!box) return;
  var cols = ['#F1BC02','#A9C23F','#0092BD','#C6027E','#FFE7D4','#A8E6FA'], kinds = ['lh','sas','rs'], html = '';
  for (var i=0;i<26;i++){
    var k = kinds[i%3], c = cols[i%cols.length], size = 12 + (i*7)%18;
    html += '<span style="left:'+((i*37)%100)+'%;width:'+size+'px;height:'+size+'px;--dy:'+(260+(i*53)%260)+'px;--rest:'+(20+(i*41)%220)+'px;--rot:'+((i*67)%360)+'deg;animation-delay:'+((i%9)*0.08)+'s">'+shape(k,c)+'</span>';
  }
  box.innerHTML = html;
}

/* =========================================================
   TAKEAWAY EXPORT
   ========================================================= */
function dateStr(){ try { return new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}); } catch(e){ return ''; } }
function takeawayText(){
  var out = ['My Community Visit Takeaways', COES[S.coe].name + ' \u00b7 ' + dateStr(), ''];
  for (var i=0;i<3;i++){ out.push(takePrompt(i)); out.push(S.take[i].trim() || '(left blank)'); out.push(''); }
  if (S.stars.length){ out.push('Questions I saved'); S.stars.forEach(function(k){ var q=questionFor(k); if(q) out.push('\u2022 ' + q); }); out.push(''); }
  if (S.values.length){ out.push('Cortland values I spotted'); S.values.forEach(function(i){ out.push('\u2022 ' + VALUES[i]); }); out.push(''); }
  if (S.culture.trim()){ out.push('Culture I noticed'); out.push(S.culture.trim()); }
  return out.join('\n').trim();
}
function setStatus(t){ var s = document.getElementById('status'); if (s) s.textContent = t; }
function copyTakeaways(){
  var text = takeawayText();
  function fallback(){
    var box = document.getElementById('copyFallback'), ta = document.getElementById('copyText');
    box.hidden = false; ta.value = text; ta.focus(); ta.select();
    setStatus('Your takeaways are selected below. Copy them into your notes.');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    var settled = false, tm = setTimeout(function(){ if(!settled){ settled = true; fallback(); } }, 1500);
    navigator.clipboard.writeText(text).then(function(){ if(settled) return; settled = true; clearTimeout(tm); setStatus('Copied. Paste your takeaways anywhere you like.'); },
      function(){ if(settled) return; settled = true; clearTimeout(tm); fallback(); });
  } else fallback();
}

var dlPromise = null;
function getDownloads(){
  if (!dlPromise) {
    dlPromise = (window.claude && typeof window.claude.use === 'function')
      ? window.claude.use('downloads').catch(function(){ return null; })
      : Promise.resolve(null);
  }
  return dlPromise;
}
function buildPDF(){
  var J = window.jspdf && window.jspdf.jsPDF; if (!J) return null;
  var doc = new J({unit:'pt', format:'letter'});
  var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 56, y;
  doc.setFillColor(3,61,126); doc.rect(0,0,W,118,'F');
  try { doc.addImage(LOGO_WHITE,'PNG',M,30,120,28.5); } catch(e){}
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(20);
  doc.text('COMMUNITY VISIT COMPLETE', M, 92);
  doc.setFillColor(241,188,2); doc.rect(0,118,W,6,'F');
  y = 156;
  doc.setTextColor(3,61,126); doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text(COES[S.coe].name + '   |   ' + dateStr(), M, y); y += 30;
  function ensure(h){ if (y + h > H - M) { doc.addPage(); y = M; } }
  function section(title, body){
    ensure(40);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(3,61,126);
    doc.splitTextToSize(title, W-2*M).forEach(function(l){ ensure(18); doc.text(l, M, y); y += 18; });
    doc.setFont('helvetica','normal'); doc.setFontSize(11.5); doc.setTextColor(30,53,83);
    doc.splitTextToSize(body, W-2*M).forEach(function(l){ ensure(16); doc.text(l, M, y); y += 16; });
    y += 14;
  }
  for (var i=0;i<3;i++) section(takePrompt(i).replace('\u2026','...'), S.take[i].trim() || '(left blank)');
  if (S.stars.length) section('Questions I saved', S.stars.map(function(k){ return '- ' + (questionFor(k)||''); }).join('\n').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"'));
  if (S.values.length) section('Cortland values I spotted', S.values.map(function(i){ return '- ' + VALUES[i]; }).join('\n'));
  if (S.culture.trim()) section('Culture I noticed', S.culture.trim());
  return doc;
}
function savePDF(){
  var doc = buildPDF();
  if (!doc) { setStatus('The PDF tool didn\u2019t load. Use Copy my takeaways instead.'); return; }
  var fname = 'Community-Visit-Takeaways.pdf';
  setStatus('Preparing your PDF\u2026');
  getDownloads().then(function(dl){
    if (dl && dl.save) {
      return dl.save({ filename: fname, data: doc.output('blob') }).then(function(){
        setStatus('PDF saved.');
      }, function(err){
        var c = err && err.code;
        if (c === 'declined') setStatus('No problem. Your PDF wasn\u2019t saved.');
        else if (c === 'rate_limited') setStatus('A save prompt is already open. Try again in a moment.');
        else setStatus('Saving a PDF isn\u2019t available here. Use Copy my takeaways instead.');
      });
    }
    try { doc.save(fname); setStatus('Your PDF is downloading.'); }
    catch(e){ setStatus('Saving a PDF isn\u2019t available here. Use Copy my takeaways instead.'); }
  });
}

/* =========================================================
   EVENTS
   ========================================================= */
var resetArmed = false;
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if (!t) return;
  var act = t.getAttribute('data-act');
  switch(act){
    case 'start': go('coe'); break;
    case 'resume': go(S.view && S.view !== 'welcome' && S.view !== 'coe' ? S.view : 'ready'); break;
    case 'pick':
      S.coe = t.getAttribute('data-coe'); S.lens = 0; save(); render({focus:false});
      var sel = main.querySelector('[data-coe="'+S.coe+'"]'); if (sel) sel.focus();
      live.textContent = 'Your lens today: ' + COES[S.coe].name; break;
    case 'goto': go(t.getAttribute('data-view'), t.getAttribute('data-anchor')); break;
    case 'stop':
      var si = +t.getAttribute('data-i'); S.openStop = S.openStop === si ? null : si; save();
      render({focus:false}); refocus('[data-act="stop"][data-i="'+si+'"]'); break;
    case 'area':
      var id = t.getAttribute('data-id'); S.openArea = S.openArea === id ? null : id; save();
      render({focus:false}); refocus('[data-act="area"][data-id="'+id+'"]'); break;
    case 'explored':
      var eid = t.getAttribute('data-id'), ix = S.explored.indexOf(eid);
      if (ix > -1) S.explored.splice(ix,1); else S.explored.push(eid); save();
      render({focus:false}); refocus('[data-act="explored"][data-id="'+eid+'"]'); break;
    case 'value':
      var vi = +t.getAttribute('data-i'), vx = S.values.indexOf(vi);
      if (vx > -1) S.values.splice(vx,1); else S.values.push(vi); save();
      t.setAttribute('aria-pressed', vx < 0); break;
    case 'rotate':
      var which = t.getAttribute('data-deck');
      var n = which === 'meet' ? SHARED_Q.length : LENS_Q[S.coe].length;
      S[which] = (S[which] + 1) % n; save(); lastRotated = which;
      var deckEl = document.getElementById('deck-'+which);
      var tmp = document.createElement('div');
      tmp.innerHTML = deckHTML(which, which==='meet'?SHARED_Q:LENS_Q[S.coe], S[which], which==='lens');
      deckEl.replaceWith(tmp.firstChild);
      lastRotated = null;
      var list = which==='meet'?SHARED_Q:LENS_Q[S.coe];
      live.textContent = 'New question: ' + list[(S[which]+2)%n];
      break;
    case 'star':
      var k = t.getAttribute('data-key'), sx = S.stars.indexOf(k);
      if (sx > -1) S.stars.splice(sx,1); else S.stars.push(k); save();
      var on = sx < 0; t.setAttribute('aria-pressed', on);
      t.setAttribute('aria-label', (on?'Saved: ':'Save question: ') + questionFor(k));
      var sv = main.querySelector('.saved'); if (sv) { var d = document.createElement('div'); d.innerHTML = savedHTML(); sv.replaceWith(d.firstChild); }
      live.textContent = on ? 'Question saved' : 'Question removed from saved';
      break;
    case 'stage':
      var gi = +t.getAttribute('data-i'); S.openStage = S.openStage === gi ? null : gi; save();
      render({focus:false}); refocus('.journey.mobile [data-act="stage"][data-i="'+gi+'"]'); break;
    case 'deskstage':
      S.deskStage = +t.getAttribute('data-i'); save(); render({focus:false});
      refocus('[data-act="deskstage"][data-i="'+S.deskStage+'"]'); break;
    case 'rprev': S.rstep = Math.max(0, S.rstep-1); save(); render(); focusTake(); break;
    case 'copy': copyTakeaways(); break;
    case 'pdf': savePDF(); break;
    case 'reset':
      if (!resetArmed) { resetArmed = true; t.textContent = 'Tap again to clear my notes'; setTimeout(function(){ resetArmed=false; var b=document.getElementById('resetBtn'); if(b) b.textContent='Start a fresh visit'; }, 4000); }
      else { resetArmed = false; clearAll(); save(); render(); }
      break;
  }
});
function refocus(sel){ var el = main.querySelector(sel); if (el) el.focus({preventScroll:true}); }
function focusTake(){ var ta = main.querySelector('textarea[data-take]'); if (ta) ta.focus(); }

document.addEventListener('input', function(e){
  var t = e.target;
  if (t.hasAttribute('data-take')) {
    var i = +t.getAttribute('data-take'); S.take[i] = t.value; save();
    var c = document.getElementById('count'+i); if (c) c.textContent = t.value.length + ' / 400';
  } else if (t.getAttribute('data-field') === 'culture') { S.culture = t.value; save(); }
});

document.getElementById('lensChip').addEventListener('click', function(){ go('coe'); });
document.getElementById('backBtn').addEventListener('click', function(){
  var v = S.view;
  if (v === 'reflect' && S.rstep > 0) { S.rstep--; save(); render(); focusTake(); return; }
  var i = ORDER.indexOf(v); if (i > 0) go(ORDER[i-1]);
});
document.getElementById('nextBtn').addEventListener('click', function(){
  var v = S.view;
  if (v === 'coe') { if (S.coe) go('ready'); return; }
  if (v === 'reflect') {
    if (S.rstep < 2) { S.rstep++; save(); render(); focusTake(); }
    else { markVisited('reflect'); go('complete'); }
    return;
  }
  var i = ORDER.indexOf(v); if (i < ORDER.length-1) go(ORDER[i+1]);
});

getDownloads();
render();
})();
</script>
